[package]
name = "kinect-driver-cli"
description = "kinect-driver as a standalone program: capture worker for kinect-hub and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kinect-driver"
path = "src/main.rs"

[dependencies]
kinect-driver = { path = "../driver", features = ["usb", "gpu"] }
log = "0.4"
png = "0.18"

[lints]
workspace = true
