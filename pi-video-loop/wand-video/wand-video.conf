# Einstellungen fürs Wand-Video. Änderungen gelten nach dem nächsten Neustart des Pi.

# Ton: hdmi (über den Bildschirm), klinke (3,5-mm-Buchse am Pi) oder aus
TON=hdmi

# Bildschirmmodus: 1920x1080@60 passt am besten zum 30-fps-Video; auto = was der Bildschirm will
MODUS=1920x1080@60

# Lautstärke in Prozent (0 bis 100)
LAUTSTAERKE=100
