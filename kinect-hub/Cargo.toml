[package]
name = "kinect-hub"
version = "0.1.0"
edition = "2024"
description = "Kinect v2 middleware: owns the sensor, precomputes once per frame, streams to many clients"
publish = false

[[bin]]
name = "kinect-hub"
path = "src/main.rs"

[[bin]]
name = "kinect-hub-probe"
path = "src/bin/probe.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
png = "0.18"
# ONNX Runtime for the pose model (pose.rs), loaded at run time from onnxruntime.dll
# (setup-onnxruntime.ps1): builds with the GNU toolchain, and the hub runs without it.
# api-24 = ONNX Runtime 1.24, the newest with DirectML.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # recordings keep the camera parameters exact
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-tungstenite = "0.28"
tower-http = { version = "0.6", features = ["fs", "cors", "catch-panic", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
debug = "line-tables-only"  # readable backtraces in the log
panic = "unwind"            # a bug in one task or thread is caught and logged, not fatal

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
