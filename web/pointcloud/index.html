<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinect Punktwolke</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; font: 13px/1.45 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; padding: 10px 12px; border-radius: 8px;
    background: rgba(0, 0, 0, 0.45); color: #d8d8d8; white-space: pre; pointer-events: none;
    transition: opacity 0.6s; font-variant-numeric: tabular-nums;
  }
  #hud.hidden { opacity: 0; }
  #state {
    position: fixed; left: 16px; top: 16px; padding: 6px 10px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.55); color: #eee; display: none;
  }
  #fatal { position: fixed; inset: 0; display: none; place-items: center; color: #ddd; padding: 2em; text-align: center; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="state"></div>
<div id="hud"></div>
<div id="fatal"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
