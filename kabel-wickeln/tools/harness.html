<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>render harness</title></head>
  <body style="margin: 0; background: #000">
    <script type="module">
      // Loads the project without the editor, for tools/render.mjs (stills and the whole video).
      // ?project=test loads the test project (model sheets, render tests); ?preview=1 is read by
      // src/three/view.ts (cheap 3D for quick reviews).
      import { PlaybackState, Renderer } from '@motion-canvas/core';
      const q = new URLSearchParams(location.search);
      const projects = {
        project: () => import('/src/project.ts?project'),
        test: () => import('/src/test.ts?project'),
        ik: () => import('/src/test-ik.ts?project'),
        coil: () => import('/src/test-coil.ts?project'),
      };
      const { default: project } = await projects[q.get('project') ?? 'project']();
      window.__mc = { project, PlaybackState, Renderer };
    </script>
  </body>
</html>
