[package]
name = "wall-bevy"
version = "0.1.0"
edition = "2024"
description = "The LED wall output (web/ /wall/) as a native Bevy app: the show, the scenes, the wall core"
publish = false

[[bin]]
name = "wall-bevy"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "multi_threaded",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_camera",
  "bevy_image",
  "bevy_shader",
  "bevy_audio",
  "wav",
  "x11",
] }
# std: error scopes per thread (Bevy builds wgpu without it: one global stack for all threads)
wgpu = { version = "30", default-features = false, features = ["std"] }
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
crossbeam-channel = "0.5"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
cosmic-text = "0.15"
jpeg-encoder = "0.6"
base64 = "0.22"
qrcodegen = "1.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 16
