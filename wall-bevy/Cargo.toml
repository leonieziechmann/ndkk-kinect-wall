[package]
name = "wall-bevy"
version = "0.1.0"
edition = "2024"
description = "The LED wall output (web/ /wall/) as a native Bevy app: the show, the scenes, the wall core"
publish = false

[[bin]]
name = "wall-bevy"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "multi_threaded",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_camera",
  "bevy_image",
  "bevy_shader",
  "bevy_audio",
  "wav",
  "x11",
] }
# std: error scopes per thread (Bevy builds wgpu without it: one global stack for all threads)
wgpu = { version = "30", default-features = false, features = ["std"] }
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
crossbeam-channel = "0.5"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
cosmic-text = "0.15"
jpeg-encoder = "0.6"
base64 = "0.22"
qrcodegen = "1.8"

# Windows: process priority and power throttling (platform.rs); already in the tree via winit
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints.clippy]
# the scenes mirror the browser's JS: its signatures and names (from_world, from_room, ...)
too_many_arguments = "allow"
wrong_self_convention = "allow"
type_complexity = "allow"
# !(a > b) on purpose: false for NaN, as in the JS it was ported from
neg_cmp_op_on_partial_ord = "allow"

# dev: the scenes run fast enough to judge them (deps optimized), links stay quick and small
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# release: line tables only for this crate (readable panics); the dependencies without (the exe stays small)
[profile.release]
debug = "line-tables-only"
codegen-units = 16

[profile.release.package."*"]
debug = false
